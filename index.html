<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube 구간 반복 플레이어</title>
  <style>
    :root {
      /* Apple Design Tokens */
      --primary: #0066cc;
      --primary-focus: #0071e3;
      --primary-active: #0055b3;
      --ink: #1d1d1f;
      --body: #1d1d1f;
      --body-muted: #86868b;
      --ink-muted-80: #333333;
      --ink-muted-48: #7a7a7a;
      --hairline: #e0e0e0;
      --divider-soft: #f0f0f0;
      --canvas: #ffffff;
      --canvas-parchment: #f5f5f7;
      --surface-pearl: #fafafc;
      --surface-chip: rgba(210, 210, 215, 0.64);
      --product-shadow: rgba(0, 0, 0, 0.22) 3px 5px 30px 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: var(--canvas-parchment);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 16px 64px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      padding: 8px 0 12px;
    }

    header h1 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.374px;
      color: var(--ink);
      margin-bottom: 8px;
    }

    header p {
      color: var(--body-muted);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.374px;
    }

    .file-protocol-warning {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #b91c1c;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .file-protocol-warning strong {
      color: #991b1b;
      font-weight: 600;
    }

    .file-protocol-warning code {
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #991b1b;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 18px;
      overflow: hidden;
      background: #000000;
      box-shadow: var(--product-shadow);
    }

    .player-wrapper iframe, .player-wrapper #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .control-panel {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted-48);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .segments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .btn-segment {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      color: var(--ink);
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      transition: border-color 0.2s ease, transform 0.15s ease, background-color 0.2s ease;
    }

    .btn-segment:hover {
      border-color: #b0b0b5;
    }

    .btn-segment:active {
      transform: scale(0.97);
    }

    .btn-segment.active {
      border: 2px solid var(--primary);
      background: rgba(0, 102, 204, 0.04);
      padding: 15px;
    }

    .btn-segment .time-range {
      font-weight: 600;
      font-size: 17px;
      line-height: 1.24;
      letter-spacing: -0.374px;
      color: var(--ink);
    }

    .btn-segment.active .time-range {
      color: var(--primary);
    }

    .btn-segment .desc {
      font-size: 14px;
      color: var(--body-muted);
      line-height: 1.3;
      letter-spacing: -0.224px;
    }

    .script-box {
      background: var(--surface-pearl);
      border: 1px solid var(--divider-soft);
      border-left: 4px solid var(--primary);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .script-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .script-speaker {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.224px;
    }

    .script-time {
      font-size: 13px;
      color: var(--ink-muted-48);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", monospace;
    }

    .script-content {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.47;
      letter-spacing: -0.374px;
      color: var(--ink);
      word-break: keep-all;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--divider-soft);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--canvas);
      border: 1px solid #d2d2d7;
      color: var(--ink);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.224px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: var(--canvas-parchment);
    }

    .tool-btn:active {
      transform: scale(0.95);
    }

    .tool-btn:focus-visible {
      outline: 2px solid var(--primary-focus);
      outline-offset: 2px;
    }

    .tool-btn.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      border-color: var(--primary);
    }

    .tool-btn.active:hover {
      background: var(--primary-focus);
    }

    .speed-select {
      background: var(--canvas);
      border: 1px solid #d2d2d7;
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    .speed-select:focus {
      border-color: var(--primary);
      outline: 2px solid var(--primary-focus);
    }

    .status-text {
      font-size: 14px;
      color: var(--ink-muted-48);
    }

    .shortcuts {
      font-size: 13px;
      color: var(--ink-muted-48);
      background: var(--canvas-parchment);
      border-radius: 12px;
      padding: 12px 16px;
      line-height: 1.6;
    }

    .shortcuts strong {
      color: var(--ink);
      font-weight: 600;
    }

    kbd {
      background: #e5e5ea;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YouTube 구간 반복 플레이어</h1>
      <p>GET REAL S5 EP 11 • Glow up 대사 구간 반복</p>
    </header>

    <div id="fileWarning" class="file-protocol-warning">
      ⚠️ <strong>오류 153 안내:</strong> YouTube 보안 정책으로 인해 브라우저에서 <code>file://</code> 경로로 직접 열면 영상이 차단됩니다.<br />
      배포된 <a href="https://justbeanpole.github.io/youtube-looper/" style="color: var(--primary); font-weight: 600; text-decoration: underline;">GitHub Pages 웹사이트</a> 또는 로컬 웹 서버로 접속하시면 정상 재생됩니다.
    </div>

    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <div class="control-panel">
      <div class="section-title">구간 선택 (클릭 시 반복 재생)</div>
      <div class="segments-grid" id="segmentsGrid"></div>

      <div class="script-box" id="scriptBox">
        <div class="script-header">
          <div class="script-speaker" id="scriptSpeaker">대사 로딩 중...</div>
          <div class="script-time" id="scriptTime"></div>
        </div>
        <div class="script-content" id="scriptContent"></div>
      </div>

      <div class="toolbar">
        <div class="tool-group">
          <button class="tool-btn active" id="btnLoopToggle" onclick="toggleLoop()">반복 재생 켜짐</button>
          <button class="tool-btn" onclick="prevSegment()">이전 구간 (Q)</button>
          <button class="tool-btn" onclick="nextSegment()">다음 구간 (W)</button>
          <button class="tool-btn" onclick="replayCurrent()">다시 재생 (R)</button>
        </div>
        <div class="tool-group">
          <label for="speedSelect" class="status-text">배속:</label>
          <select id="speedSelect" class="speed-select" onchange="changeSpeed(this.value)">
            <option value="0.75">0.75x</option>
            <option value="0.8">0.8x</option>
            <option value="0.9">0.9x</option>
            <option value="1.0" selected>1.0x (기본)</option>
            <option value="1.25">1.25x</option>
          </select>
        </div>
      </div>

      <div class="shortcuts">
        <strong>단축키:</strong> <kbd>Space</kbd> 재생/일시정지 | <kbd>Q</kbd> 이전 구간 | <kbd>W</kbd> 다음 구간 | <kbd>R</kbd> 현재 구간 처음부터 | <kbd>L</kbd> 반복 On/Off
      </div>
    </div>
  </div>

  <script>
    const VIDEO_ID = 'y8wDcm_x74E';
    
    // 구간 정의 (시작초 ~ 종료초)
    const segments = [
      {
        id: 0,
        icon: "1️⃣",
        speaker: "BM",
        label: "1️⃣ BM",
        start: 747,
        end: 761,
        text: "12:27 ~ 12:41 (14초)",
        script: "Have you guys ever had that moment where like you try something new, like you switch your style up, whether it be your hair or something, you're just you look in the mirror after and you're like, I like this me. You guys ever have that?"
      },
      {
        id: 1,
        icon: "2️⃣",
        speaker: "BM",
        label: "2️⃣ BM",
        start: 774,
        end: 792,
        text: "12:54 ~ 13:12 (18초)",
        script: "But I feel like those moments are kind of like a start to a glow up phase. You know what I mean? Like, oh, I found something new about me that looks good and feels good. You know, when when did you feel like that happened? It's like when you change your clothes?"
      },
      {
        id: 2,
        icon: "3️⃣",
        speaker: "Ashley",
        label: "3️⃣ Ashley",
        start: 792,
        end: 818,
        text: "13:12 ~ 13:38 (26초)",
        script: "Well, recently I changed my hair and then I kind of had to change my entire like style because this was kind of like it was kind of tomboyish but also kind of I wanted to go for the '90s vibe, like the '90s Hollywood style. So then I felt like I had to change my style. But then I was like I dig it. And I think a after breakup you kind of have a glow up,"
      },
      {
        id: 3,
        icon: "4️⃣",
        speaker: "BM",
        label: "4️⃣ BM",
        start: 836,
        end: 860,
        text: "13:56 ~ 14:20 (24초)",
        script: "Cuz cuz after you pull yourself together from there it's just like motivation. Motivation I think is a really big influence on on having a glow up. Like when you just feel like, okay, this is what I'm going to do and this is how I'm going to do it. And you have you feel like you have everything locked in. Yeah. Motivation. How do we find motivation though?"
      }
    ];

    let player = null;
    let currentSegmentIndex = 0;
    let isLooping = true;
    let checkInterval = null;

    // file:// 프로토콜 감지 시 경고 배너 표시
    if (window.location.protocol === 'file:') {
      const warnEl = document.getElementById('fileWarning');
      if (warnEl) warnEl.style.display = 'block';
    }

    // YouTube IFrame API 로드
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      const origin = (window.location.protocol.startsWith('http')) ? window.location.origin : undefined;
      player = new YT.Player('player', {
        host: 'https://www.youtube-nocookie.com',
        videoId: VIDEO_ID,
        playerVars: {
          playsinline: 1,
          rel: 0,
          start: segments[0].start,
          enablejsapi: 1,
          ...(origin ? { origin: origin } : {})
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function updateScriptDisplay(idx) {
      const seg = segments[idx];
      const speakerEl = document.getElementById('scriptSpeaker');
      const timeEl = document.getElementById('scriptTime');
      const contentEl = document.getElementById('scriptContent');
      if (speakerEl && seg) speakerEl.textContent = `${seg.icon} ${seg.speaker}`;
      if (timeEl && seg) timeEl.textContent = seg.text;
      if (contentEl && seg) contentEl.textContent = `"${seg.script}"`;
    }

    function renderButtons() {
      const grid = document.getElementById('segmentsGrid');
      grid.innerHTML = '';
      segments.forEach((seg, idx) => {
        const btn = document.createElement('button');
        btn.className = `btn-segment ${idx === currentSegmentIndex ? 'active' : ''}`;
        btn.id = `seg-btn-${idx}`;
        const parts = seg.text.split(' ');
        btn.innerHTML = `
          <div class="time-range">${parts[0]} ${parts[1]} ${parts[2]}</div>
          <div class="desc">${seg.label} • ${seg.end - seg.start}초</div>
        `;
        btn.onclick = () => selectSegment(idx);
        grid.appendChild(btn);
      });
      updateScriptDisplay(currentSegmentIndex);
    }

    function onPlayerReady() {
      renderButtons();
      startLoopMonitor();
    }

    function selectSegment(idx) {
      currentSegmentIndex = idx;
      updateActiveButton();
      updateScriptDisplay(idx);
      const seg = segments[idx];
      if (player && player.seekTo) {
        player.seekTo(seg.start, true);
        player.playVideo();
      }
    }

    function updateActiveButton() {
      document.querySelectorAll('.btn-segment').forEach((b, idx) => {
        if (idx === currentSegmentIndex) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    }

    function startLoopMonitor() {
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING) return;

        const currentTime = player.getCurrentTime();
        const activeSeg = segments[currentSegmentIndex];

        if (isLooping && currentTime >= activeSeg.end) {
          player.seekTo(activeSeg.start, true);
        }
      }, 100);
    }

    function toggleLoop() {
      isLooping = !isLooping;
      const btn = document.getElementById('btnLoopToggle');
      if (isLooping) {
        btn.innerText = "반복 재생 켜짐";
        btn.classList.add('active');
      } else {
        btn.innerText = "반복 재생 꺼짐";
        btn.classList.remove('active');
      }
    }

    function prevSegment() {
      const newIdx = (currentSegmentIndex - 1 + segments.length) % segments.length;
      selectSegment(newIdx);
    }

    function nextSegment() {
      const newIdx = (currentSegmentIndex + 1) % segments.length;
      selectSegment(newIdx);
    }

    function replayCurrent() {
      selectSegment(currentSegmentIndex);
    }

    function changeSpeed(val) {
      if (player && player.setPlaybackRate) {
        player.setPlaybackRate(parseFloat(val));
      }
    }

    // 단축키 이벤트
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!player) return;
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      } else if (e.key === 'q' || e.key === 'Q') {
        prevSegment();
      } else if (e.key === 'w' || e.key === 'W') {
        nextSegment();
      } else if (e.key === 'r' || e.key === 'R') {
        replayCurrent();
      } else if (e.key === 'l' || e.key === 'L') {
        toggleLoop();
      }
    });

    renderButtons();
  </script>
</body>
</html>
